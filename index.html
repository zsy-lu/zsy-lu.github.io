<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>跳一跳 · Jump</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#aedcf0;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  }
  #wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  /* HUD */
  #hud {
    position:absolute; top:max(14px,env(safe-area-inset-top)); left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 18px; pointer-events:none; color:#3a3a55;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  #score { font-size:42px; font-weight:800; letter-spacing:1px; line-height:1; }
  #runScore { font-size:14px; font-weight:700; opacity:.8; margin-top:2px; }
  #best  { font-size:15px; font-weight:600; opacity:.8; text-align:right; line-height:1.4; }
  #combo {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
    font-size:34px; font-weight:900; color:#ff8a3d;
    text-shadow:0 2px 8px rgba(255,120,40,.5); pointer-events:none; opacity:0;
  }
  #tier {
    position:absolute; top:36%; left:50%; transform:translate(-50%,-50%) scale(0);
    font-size:30px; font-weight:900; pointer-events:none; opacity:0;
    text-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  #toast {
    position:absolute; top:16%; left:50%; transform:translate(-50%,-20px);
    background:rgba(44,44,69,.92); color:#fff; padding:10px 18px; border-radius:30px;
    font-size:15px; font-weight:800; opacity:0; transition:opacity .3s, transform .3s;
    pointer-events:none; z-index:30; white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #skins { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:320px; pointer-events:auto; }
  .skin {
    width:42px; height:42px; border-radius:50%; border:3px solid rgba(255,255,255,.7);
    cursor:pointer; position:relative; transition:transform .1s;
  }
  .skin.sel { border-color:#ff6b5e; transform:scale(1.12); }
  .skin.locked { filter:grayscale(1) brightness(.7); cursor:not-allowed; }
  .skin .lk {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.6);
  }

  /* Overlays */
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:rgba(174,220,240,.6); backdrop-filter:blur(3px);
    color:#2c2c45; text-align:center; padding:24px; z-index:10;
  }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:38px; font-weight:900; letter-spacing:2px; }
  .overlay p  { font-size:16px; line-height:1.7; max-width:300px; opacity:.85; }
  .btn {
    pointer-events:auto; cursor:pointer; border:none;
    background:#ff6b5e; color:#fff; font-size:20px; font-weight:800;
    padding:14px 40px; border-radius:40px;
    box-shadow:0 6px 18px rgba(255,107,94,.45);
    transition:transform .08s ease;
  }
  .btn:active { transform:scale(.95); }
  .btn.ghost { background:rgba(255,255,255,.65); color:#2c2c45; box-shadow:none; }
  .hint { font-size:14px; opacity:.7; }

  /* 进度条 */
  .prog { width:240px; max-width:72vw; height:14px; background:rgba(255,255,255,.55); border-radius:10px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,#ffb03a,#ff6b5e); transition:width .4s; }
  .prog-txt { font-size:13px; font-weight:800; opacity:.9; }

  /* 商店 */
  .shop-bal { font-size:18px; font-weight:800; opacity:.9; }
  #shopList { display:flex; flex-direction:column; gap:10px; width:330px; max-width:88vw; max-height:54vh; overflow-y:auto; padding:2px; }
  .shop-item { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.72); border-radius:14px; padding:10px 12px; gap:10px; }
  .si-info { flex:1; text-align:left; }
  .si-name { font-size:16px; font-weight:800; color:#2c2c45; }
  .si-desc { font-size:12px; opacity:.75; margin-top:2px; }
  .si-buy { background:#ff6b5e; color:#fff; border:none; border-radius:20px; padding:9px 14px; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .si-buy.disabled { background:#b9b9c4; cursor:not-allowed; }

  #finalScore { font-size:60px; font-weight:900; color:#ff6b5e; }
  .backup-area {
    width:88vw; max-width:330px; height:90px; border-radius:12px;
    border:2px solid rgba(255,255,255,.7); padding:10px;
    font-size:13px; font-family:monospace; resize:none;
    color:#2c2c45; background:rgba(255,255,255,.85);
  }

  /* 右上角悬浮按钮 */
  .corner-btn {
    position:absolute; top:14px; right:14px; z-index:20;
    pointer-events:auto; cursor:pointer; border:none;
    background:rgba(44,44,69,.85); color:#fff; font-size:14px; font-weight:800;
    padding:8px 14px; border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .corner-btn:active { transform:scale(.94); }
  #assistBtn { top:56px; }
  #cheatInput {
    width:220px; max-width:72vw; border-radius:10px; border:2px solid rgba(255,255,255,.7);
    padding:11px; font-size:16px; text-align:center; color:#2c2c45; background:rgba(255,255,255,.92);
  }
  .cheat-add { background:rgba(255,255,255,.45); color:#2c2c45; border:none; border-radius:18px; padding:8px 14px; font-size:14px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div id="score">0</div>
      <div id="runScore">本局 +0</div>
      <div id="best">单局最高 <span id="bestVal">0</span></div>
    </div>
  </div>
  <div id="combo"></div>
  <div id="tier"></div>
  <div id="toast"></div>
  <button id="assistBtn" class="corner-btn" style="display:none">辅助线：开</button>
  <button id="cheatBtn" class="corner-btn">作弊</button>

  <div id="startScreen" class="overlay">
    <h1>跳 一 跳</h1>
    <div class="prog"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-txt" id="progTxt">积分 0 · 已可领 0 杯</div>
    <p>积分每满 3w，找发你链接的人领一杯奶茶<br>（可重复领，攒够就截图）</p>
    <div id="skins"></div>
    <div class="hint" id="skinHint">累计完美 <span id="tpVal">0</span> · 解锁更多皮肤</div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="startBtn">开始</button>
      <button class="btn ghost" id="shopBtn">商店</button>
      <button class="btn ghost" id="backupBtn">备份</button>
    </div>
    <div class="hint">手机 / 电脑都能玩 · 支持触屏与鼠标</div>
  </div>

  <div id="shopScreen" class="overlay hidden">
    <h1>商 店</h1>
    <div class="shop-bal">积分 <span id="shopBal">0</span></div>
    <div id="shopList"></div>
    <button class="btn" id="shopClose">返回</button>
  </div>

  <div id="reviveScreen" class="overlay hidden">
    <h1>差一点！</h1>
    <p>还剩 <span id="reviveLeft">1</span> 次复活机会</p>
    <button class="btn" id="reviveBtn">复活</button>
    <button class="btn ghost" id="giveUpBtn">放弃</button>
  </div>

  <div id="drinkScreen" class="overlay hidden">
    <h1>🥤 奶茶到！</h1>
    <p id="drinkMsg"></p>
    <button class="btn" id="drinkClose">继续玩</button>
  </div>

  <div id="achScreen" class="overlay hidden">
    <h1>🏆 隐藏成就</h1>
    <p>积分突破 10w！<br>作者请你吃饭（真请，截图留证）</p>
    <button class="btn" id="achClose">收下</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1>掉下去啦</h1>
    <div id="finalScore">0</div>
    <p id="overTip">本次得分</p>
    <button class="btn" id="retryBtn">再来一次</button>
    <button class="btn ghost" id="overShopBtn">商店</button>
  </div>

  <div id="backupScreen" class="overlay hidden">
    <h1>存档备份</h1>
    <p>点“导出存档码”生成一串码，存到备忘录；换手机/清缓存时粘贴回来点“导入恢复”即可。</p>
    <textarea id="backupCode" class="backup-area" placeholder="存档码会显示在这里 / 粘贴存档码到这里"></textarea>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="exportBtn">导出存档码</button>
      <button class="btn ghost" id="importBtn">导入恢复</button>
      <button class="btn ghost" id="backupClose">返回</button>
    </div>
    <div class="hint" id="backupMsg"></div>
  </div>

  <div id="cheatFlow" class="overlay hidden">
    <h1 id="cheatTitle">作弊</h1>
    <p id="cheatMsg"></p>
    <div id="cheatInputWrap" style="display:none">
      <input id="cheatInput" type="text" placeholder="在此输入">
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;">
        <button class="cheat-add" id="cheatAdd1k">+1000</button>
        <button class="cheat-add" id="cheatAdd1w">+10000</button>
      </div>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="cheatOk">确定</button>
      <button class="btn ghost" id="cheatCancel">取消</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const runScoreEl = document.getElementById('runScore');
  const bestValEl = document.getElementById('bestVal');
  const comboEl = document.getElementById('combo');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const overTipEl = document.getElementById('overTip');
  const shopScreen = document.getElementById('shopScreen');
  const shopListEl = document.getElementById('shopList');
  const shopBalEl = document.getElementById('shopBal');
  const reviveScreen = document.getElementById('reviveScreen');
  const reviveLeftEl = document.getElementById('reviveLeft');
  const drinkScreen = document.getElementById('drinkScreen');
  const drinkMsgEl = document.getElementById('drinkMsg');
  const achScreen = document.getElementById('achScreen');
  const progFill = document.getElementById('progFill');
  const progTxt = document.getElementById('progTxt');
  const toastEl = document.getElementById('toast');
  const backupScreen = document.getElementById('backupScreen');
  const backupCodeEl = document.getElementById('backupCode');
  const backupMsgEl = document.getElementById('backupMsg');

  // ---------- 画布尺寸 / DPR ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 参数 ----------
  const TILE_W = 92, TILE_H = 46;      // 等距菱形宽高 (2:1)
  const BLOCK_H = 64;                   // 方块像素高度
  const HALF = 0.5;                     // 方块顶面半宽(世界单位)
  const MAX_CHARGE = 1100;              // 满蓄力毫秒
  const MAX_JUMP = 5.2;                 // 满蓄力跳跃距离(世界单位)
  const BASE_GAP = 2.3;                 // 初始间距
  const GAP_CAP = BASE_GAP + 1.4;       // 间距封顶(难度低)
  const PERFECT_R = 0.15;               // 完美落点半径(略宽, 难度低)
  const GREAT_R = 0.34;                 // 良好落点半径
  const COMBO_SCORE_CAP = 10;           // combo 计分倍率封顶, 防单局分数通胀
  const COMBO_DECAY = 1;                // Good 落点 combo 掉级数(软衰减, 不清零)
  const GOAL = 30000;                   // 奶茶奖励目标(每满 3w 可重复领)
  const ACH10 = 100000;                 // 隐藏成就阈值: 作者请你吃饭
  const MILESTONES = [[50,1000],[100,3000],[150,5000],[200,10000]]; // 本局跳跃数里程碑奖励(每局各触发一次)
  const PALETTE = ['#f6c1b3','#f7d9a6','#bfe3c0','#a9d4ef','#d8c2ec','#f9b8d0','#c7e9d4'];

  // 皮肤(纯展示, 不影响手感). 货币=累计完美数 totalPerfect, 里程碑阈值解锁(无消耗, 无通胀)
  const SKINS = [
    { id:0, name:'经典', body:'#4a4a6a', head:'#5b5b82', trail:null,     unlockPerfect:0 },
    { id:1, name:'火焰', body:'#e8623a', head:'#ff9a3c', trail:'#ff7a2a', unlockPerfect:20 },
    { id:2, name:'霓虹', body:'#7b3aff', head:'#c08bff', trail:'#a86bff', unlockPerfect:50 },
    { id:3, name:'黄金', body:'#caa12e', head:'#ffe07a', trail:'#ffd54a', unlockPerfect:100 },
    { id:4, name:'幽灵', body:'#9fb3c8', head:'#d7e6f2', trail:'#bfe0f5', unlockPerfect:200 }
  ];

  // 商店道具(永久升级, 终身生效). 单数字积分既是货币也是进度
  const UPG = {
    base:   { name:'蓄力加成',   desc:'每跳基础分 +1',          costs:[200,500,1100,2000,3500],       max:5, fmt:l=>'每跳 +'+(1+l) },
    combo:  { name:'连跳倍率',   desc:'连击加分倍率',            costs:[500,750],                       max:2, fmt:l=>'×'+(1+l) },
    center: { name:'中心奖励',   desc:'完美落点基础分',          costs:[500,2000],                      max:2, fmt:l=>'基础 +'+(2+2*l) },
    revive: { name:'复活',       desc:'每局可复活次数',          costs:[500,750],                       max:2, fmt:l=>l+' 次/局' },
    assist: { name:'蓄力辅助线', desc:'蓄力槽显示落点安全/完美区', costs:[1000,2000,3000],             max:3, fmt:l=> l===0?('未开启') : (l===1?('安全区') : (l===2?('+完美区') : ('+落点放大'))) },
    roast:  { name:'吐槽作者',   desc:'发泄一下，点一次 +1 分（不涨价）', cost:-1, special:true }
  };
  const UPG_KEYS = ['base','combo','center','revive','assist','roast'];
  const ROASTS = [
    '作者z：手感是我熬夜调的，骂轻点🙏',
    '作者z：完美判定已经给你放宽了，知足吧',
    '作者z：3w 奶茶算你便宜了，别得寸进尺',
    '作者z：别跳了，起来搬砖',
    '作者z：这分数我看了都替你着急',
    '作者z：存档记得备份，丢了别来找我哭',
    '作者z：投诉无效，最终解释权归我',
    '作者z：你再吐槽，下次奶茶换成白开水'
  ];

  // ---------- 升级派生值 ----------
  function comboMult()    { return 1 + upg.combo; }
  function centerBonus()  { return 2 + 2 * upg.center; }
  function reviveMax()    { return upg.revive; }
  const ASSIST_SCALE = 1.3;   // 辅助线3级: 落点容错等比例放大
  function effHalf()    { return HALF     * (upg.assist >= 3 ? ASSIST_SCALE : 1); }
  function effPerfect() { return PERFECT_R* (upg.assist >= 3 ? ASSIST_SCALE : 1); }
  function effGreat()   { return GREAT_R  * (upg.assist >= 3 ? ASSIST_SCALE : 1); }

  // ---------- 状态 ----------
  const STATE = { READY:'ready', CHARGING:'charging', JUMPING:'jumping', FALLING:'falling', REVIVE:'revive', OVER:'over' };
  let state = STATE.READY;
  let blocks = [];        // {wx, wy, color, gold}
  let curIdx = 0;         // 当前所在块索引
  let score = 0, best = 0, combo = 0, totalPerfect = 0, currentSkin = 0;
  let totalScore = 0;     // 单数字: 终身累计积分(货币+进度)
  let upg = { base:0, combo:0, center:0, revive:0, assist:0 };
  let assistOn = true;
  let drinkTiersClaimed = 0;            // 已领取奶茶档位数(每满 3w 一档)
  let ach10 = false;                    // 10w 隐藏成就是否已触发
  let msShown = { 1:false };
  let runJumps = 0;       // 本局成功跳跃数
  let revivesLeft = 0;    // 本局剩余复活
  let milestoneHit = {};  // 本局已触发里程碑
  let cam = { wx:0, wy:0 };
  let charge = 0, chargeStart = 0;
  let hero = { wx:0, wy:0, z:0, squash:0 };
  let jump = { fromX:0, fromY:0, toX:0, toY:0, t:0, dur:0, h:0, fallV:0 };
  let ripples = [], particles = [], shake = 0;

  try { best = parseInt(localStorage.getItem('jump_best') || '0', 10) || 0; } catch(e){}
  try { totalPerfect = parseInt(localStorage.getItem('jump_tp') || '0', 10) || 0; } catch(e){}
  try { currentSkin = parseInt(localStorage.getItem('jump_skin') || '0', 10) || 0; } catch(e){}
  try { totalScore = parseInt(localStorage.getItem('jump_total') || '0', 10) || 0; } catch(e){}
  try { upg = Object.assign(upg, JSON.parse(localStorage.getItem('jump_upg') || '{}')); } catch(e){}
  try { drinkTiersClaimed = parseInt(localStorage.getItem('jump_drink') || '0', 10) || 0; } catch(e){}
  try { ach10 = localStorage.getItem('jump_ach10') === '1'; } catch(e){}
  try { msShown = Object.assign({1:false}, JSON.parse(localStorage.getItem('jump_ms') || '{}')); } catch(e){}
  try { if (localStorage.getItem('jump_assist_on') === '0') assistOn = false; } catch(e){}
  bestValEl.textContent = best;

  function saveTotal(){ try{ localStorage.setItem('jump_total', totalScore); }catch(e){} }
  function saveUpg(){ try{ localStorage.setItem('jump_upg', JSON.stringify(upg)); }catch(e){} }
  function saveDrink(){ try{ localStorage.setItem('jump_drink', drinkTiersClaimed); }catch(e){} }
  function saveMs(){ try{ localStorage.setItem('jump_ms', JSON.stringify(msShown)); }catch(e){} }
  function saveAch(){ try{ localStorage.setItem('jump_ach10', ach10 ? '1' : '0'); }catch(e){} }
  function saveAssist(){ try{ localStorage.setItem('jump_assist_on', assistOn ? '1' : '0'); }catch(e){} }

  // 存档备份码
  const SAVE_KEYS = ['jump_best','jump_tp','jump_skin','jump_total','jump_upg','jump_drink','jump_ms','jump_ach10'];
  function openBackup() {
    backupScreen.classList.remove('hidden');
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    shopScreen.classList.add('hidden');
    backupCodeEl.value = ''; backupMsgEl.textContent = '';
  }
  function closeBackup() {
    backupScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  }
  function exportSave() {
    const data = {};
    for (const k of SAVE_KEYS) {
      const v = localStorage.getItem(k);
      if (v !== null) data[k] = v;
    }
    try {
      backupCodeEl.value = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      backupMsgEl.textContent = '已生成，长按全选复制，存到备忘录';
    } catch(e) { backupMsgEl.textContent = '导出失败'; }
  }
  function importSave() {
    const code = backupCodeEl.value.trim();
    if (!code) { backupMsgEl.textContent = '先把存档码粘贴进来'; return; }
    try {
      const json = decodeURIComponent(escape(atob(code)));
      const data = JSON.parse(json);
      let n = 0;
      for (const k of SAVE_KEYS) {
        if (k in data) { localStorage.setItem(k, data[k]); n++; }
      }
      if (n === 0) throw new Error('empty');
      backupMsgEl.textContent = '恢复成功，正在刷新…';
      setTimeout(() => location.reload(), 700);
    } catch(e) { backupMsgEl.textContent = '存档码无效，检查一下'; }
  }

  // ---------- 音效 (WebAudio 合成, 无外部文件) ----------
  let actx = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function beep(freq, dur, type, vol, slideTo) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, a.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  const sfx = {
    charge: () => beep(220, 0.08, 'sine', 0.08, 320),
    jump:   () => beep(380, 0.18, 'triangle', 0.18, 720),
    land:   () => beep(180, 0.12, 'sine', 0.22, 90),
    perfect:() => { beep(880, 0.12, 'sine', 0.2, 1320); beep(1320, 0.14, 'sine', 0.12); },
    great:  () => beep(560, 0.10, 'sine', 0.16, 760),
    good:   () => beep(300, 0.10, 'sine', 0.16, 240),
    gold:   () => { beep(660,0.1,'square',0.12,990); beep(990,0.14,'square',0.1,1320); },
    buy:    () => { beep(720,0.1,'sine',0.18,960); beep(960,0.12,'sine',0.12,1280); },
    fail:   () => beep(300, 0.5, 'sawtooth', 0.18, 70)
  };
  function vibrate(ms){ if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

  // ---------- 等距投影 ----------
  let anchorX = 0, anchorY = 0;
  function updateAnchor() { anchorX = W * 0.32; anchorY = H * 0.60; }
  updateAnchor();
  window.addEventListener('resize', updateAnchor);

  function project(wx, wy, wz) {
    const dx = wx - cam.wx, dy = wy - cam.wy;
    return {
      x: anchorX + (dx - dy) * TILE_W / 2,
      y: anchorY + (dx + dy) * TILE_H / 2 - (wz || 0) * BLOCK_H
    };
  }

  // ---------- 方块生成 ----------
  function gapFor() {
    return Math.min(BASE_GAP + score * 0.012, GAP_CAP); // 间距随本局分缓慢增大, 封顶(难度低)
  }
  function makeBlock(prev, idx) {
    const gap = gapFor() * (0.85 + Math.random() * 0.3);
    const ang = (Math.random() * 70 - 35) * Math.PI / 180;
    const wx = prev.wx + Math.cos(ang) * gap;
    const wy = prev.wy + Math.sin(ang) * gap;
    const gold = (idx > 3 && Math.random() < 0.18);
    return { wx, wy, color: PALETTE[(idx * 3 + Math.floor(Math.random()*PALETTE.length)) % PALETTE.length], gold };
  }
  function ensureBlocks() {
    while (blocks.length < curIdx + 3) {
      blocks.push(makeBlock(blocks[blocks.length - 1], blocks.length));
    }
  }

  function resetGame() {
    blocks = [{ wx:0, wy:0, color:'#f6c1b3', gold:false }];
    curIdx = 0; score = 0; combo = 0; charge = 0;
    hero.wx = 0; hero.wy = 0; hero.z = 1; hero.squash = 0;
    cam.wx = 0; cam.wy = 0;
    ripples = []; particles = []; shake = 0;
    ensureBlocks();
    scoreEl.textContent = totalScore;
    state = STATE.READY;
  }

  // ---------- 输入 ----------
  function onPress(e) {
    audio();
    if (state === STATE.READY) {
      state = STATE.CHARGING;
      chargeStart = performance.now();
      charge = 0;
      sfx.charge();
      e.preventDefault();
    }
  }
  function onRelease(e) {
    if (state === STATE.CHARGING) {
      const dur = performance.now() - chargeStart;
      charge = Math.min(dur / MAX_CHARGE, 1);
      startJump();
      e.preventDefault();
    }
  }
  cv.addEventListener('touchstart', onPress, { passive:false });
  cv.addEventListener('touchend', onRelease, { passive:false });
  cv.addEventListener('mousedown', onPress);
  window.addEventListener('mouseup', onRelease);

  function startJump() {
    const cur = blocks[curIdx];
    const target = blocks[curIdx + 1];
    const ddx = target.wx - cur.wx, ddy = target.wy - cur.wy;
    const dlen = Math.hypot(ddx, ddy) || 1;
    const ux = ddx / dlen, uy = ddy / dlen;
    const dist = charge * MAX_JUMP;
    jump.fromX = cur.wx; jump.fromY = cur.wy;
    jump.toX = cur.wx + ux * dist; jump.toY = cur.wy + uy * dist;
    jump.t = 0;
    jump.dur = 0.28 + dist * 0.06;
    jump.h = 0.9 + dist * 0.25;
    state = STATE.JUMPING;
    sfx.jump();
    vibrate(8);
  }

  // ---------- 落点判定 ----------
  function resolveLanding() {
    const target = blocks[curIdx + 1];
    const d = Math.hypot(jump.toX - target.wx, jump.toY - target.wy);
    if (d <= effHalf()) {
      const lx = jump.toX, ly = jump.toY; // 实际落点(用于显示偏移)
      const tier = target.gold ? 'gold' : (d <= effPerfect() ? 'perfect' : d <= effGreat() ? 'great' : 'good');
      let pts = 0, isPerfect = false;

      if (tier === 'gold') {
        combo++;
        pts = 5 + upg.base;
        spawnRipple(lx, ly, '#ffd54a');
        spawnGold(lx, ly);
        showTier('GOLD', '#ffb300');
        showCombo(combo);
        sfx.gold(); vibrate([10, 30, 10]);
      } else if (tier === 'perfect') {
        totalPerfect++; isPerfect = true;
        combo++;
        pts = centerBonus() + comboMult() * Math.min(combo, COMBO_SCORE_CAP);
        spawnRipple(lx, ly, SKINS[currentSkin].trail || '#ffd54a');
        showTier('PERFECT', '#ff8a3d');
        showCombo(combo);
        sfx.perfect(); vibrate(20);
        checkUnlock();
      } else if (tier === 'great') {
        pts = 1 + upg.base;
        spawnRipple(lx, ly, '#bfe6f5');
        showTier('GREAT', '#3aa0ff');
        sfx.great(); vibrate(12);
      } else { // good
        combo = Math.max(0, combo - COMBO_DECAY);
        pts = 1 + upg.base;
        spawnRipple(lx, ly, '#d8d8e0');
        showTier('GOOD', '#99a');
        sfx.good(); vibrate(10);
      }

      runJumps++;
      // 本局跳跃里程碑奖励(50/100/150/200 各触发一次, 计入终身进度)
      for (const m of MILESTONES) {
        if (runJumps === m[0] && !milestoneHit[m[0]]) {
          milestoneHit[m[0]] = true;
          totalScore += m[1]; score += m[1];
          showTier('里程碑 +' + m[1], '#ffd54a');
          sfx.gold(); vibrate(20);
        }
      }
      // 记账(单数字: 终身累计, 本局得分)
      totalScore += pts; score += pts;

      // 辅助线关闭时: 每 20 跳当局积分翻倍(风险换收益)
      if (runJumps > 0 && runJumps % 20 === 0 && !assistOn) {
        const bonus = score;
        score += bonus; totalScore += bonus;
        toast('🚀 辅助关闭奖励 · 当局积分翻倍 +' + bonus);
        sfx.gold();
      }

      curIdx++;
      hero.wx = target.wx; hero.wy = target.wy; hero.z = 1; hero.squash = 0.5;
      ensureBlocks();
      if (score > best) { best = score; bestValEl.textContent = best; try{ localStorage.setItem('jump_best', best); }catch(e){} }
      if (isPerfect) { try{ localStorage.setItem('jump_tp', totalPerfect); }catch(e){} }
      saveTotal();
      updateRunHud();
      updateProgressUI();
      checkProgress();
      state = STATE.READY;
    } else {
      // 失败
      if (revivesLeft > 0) {
        revivesLeft--;
        showRevive();
      } else {
        state = STATE.FALLING;
        jump.fallV = 0;
        sfx.fail(); vibrate([40, 40, 40]);
        shake = 10;
      }
    }
  }

  // 完美数里程碑解锁检测(动态判断)
  function checkUnlock() {
    for (const s of SKINS) {
      if (s.unlockPerfect > 0 && totalPerfect === s.unlockPerfect) {
        showUnlock(s.name);
      }
    }
  }

  function spawnRipple(wx, wy, color) {
    ripples.push({ wx, wy, r:0, max:1.4, color, life:1 });
  }
  function spawnGold(wx, wy) {
    for (let i=0;i<10;i++){
      const a = Math.random()*Math.PI*2, s = 1+Math.random()*2;
      particles.push({ wx, wy, vx:Math.cos(a)*s*0.02, vy:Math.sin(a)*s*0.02, z:1, vz:0.06+Math.random()*0.05, life:1, color:'#ffd54a' });
    }
  }
  let comboTimer = 0;
  function showCombo(c) {
    if (c < 2) return;
    comboEl.textContent = '连击 x' + c + '!';
    comboEl.style.transition = 'none';
    comboEl.style.opacity = '1';
    comboEl.style.transform = 'translate(-50%,-50%) scale(1.2)';
    comboTimer = 0.9;
  }

  // ---------- 进度 / 奖励 ----------
  function updateProgressUI() {
    const tier = Math.floor(totalScore / GOAL);
    const within = totalScore - tier * GOAL;
    const pct = Math.min(100, within / GOAL * 100);
    progFill.style.width = pct + '%';
    progTxt.textContent = '积分 ' + totalScore + ' · 已可领 ' + drinkTiersClaimed + ' 杯';
  }
  function showDrink(gained) {
    drinkMsgEl.innerHTML = '积分又攒够 3w 啦！<br>本次可领 ' + gained + ' 杯奶茶（累计已领 ' + drinkTiersClaimed + ' 杯）<br>截图找发你链接的人领（喝啥你定）';
    drinkScreen.classList.remove('hidden');
  }
  function checkProgress() {
    if (!msShown[1] && totalScore >= 10000) { msShown[1] = true; saveMs(); toast('🎉 积分破 1 万！'); }
    // 每满 3w 可重复领奶茶(按已领取档位单调推进, 防止花钱再刷)
    const newTier = Math.floor(totalScore / GOAL);
    if (newTier > drinkTiersClaimed) {
      const gained = newTier - drinkTiersClaimed;
      drinkTiersClaimed = newTier; saveDrink();
      showDrink(gained);
    }
    // 10w 隐藏成就: 作者请你吃饭(一次性)
    if (!ach10 && totalScore >= ACH10) {
      ach10 = true; saveAch();
      achScreen.classList.remove('hidden');
    }
  }
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }
  function updateRunHud() {
    scoreEl.textContent = totalScore;
    runScoreEl.textContent = '本局 +' + score;
  }

  // ---------- 商店 ----------
  let shopReturn = 'start';
  function openShop(from) {
    shopReturn = from;
    buildShop();
    shopScreen.classList.remove('hidden');
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
  }
  function closeShop() {
    shopScreen.classList.add('hidden');
    if (shopReturn === 'over') overScreen.classList.remove('hidden');
    else startScreen.classList.remove('hidden');
  }
  function buildShop() {
    shopBalEl.textContent = totalScore;
    shopListEl.innerHTML = '';
    UPG_KEYS.forEach(k => {
      const u = UPG[k];
      const row = document.createElement('div');
      row.className = 'shop-item';
      const info = document.createElement('div');
      info.className = 'si-info';
      if (u.special) {
        info.innerHTML = '<div class="si-name">' + u.name + '</div><div class="si-desc">' + u.desc + '</div>';
        row.appendChild(info);
        const btn = document.createElement('button');
        const can = totalScore >= u.cost;
        btn.className = 'si-buy' + (can ? '' : ' disabled');
        btn.textContent = u.cost + ' 积分';
        if (can) btn.addEventListener('click', () => buyUpgrade(k));
        row.appendChild(btn);
      } else {
        const lvl = upg[k];
        const maxed = lvl >= u.max;
        const cost = maxed ? 0 : u.costs[lvl];
        const can = !maxed && totalScore >= cost;
        info.innerHTML = '<div class="si-name">' + u.name + '</div><div class="si-desc">' + u.desc + ' · 当前 ' + u.fmt(lvl) + '</div>';
        row.appendChild(info);
        const btn = document.createElement('button');
        btn.className = 'si-buy' + (can ? '' : ' disabled');
        btn.textContent = maxed ? '已满级' : (cost + ' 积分');
        if (can) btn.addEventListener('click', () => buyUpgrade(k));
        row.appendChild(btn);
      }
      shopListEl.appendChild(row);
    });
    refreshAssistBtn();
  }
  function buyUpgrade(k) {
    const u = UPG[k];
    if (u.special) {
      if (totalScore < u.cost) return;
      totalScore -= u.cost;
      saveTotal(); sfx.buy(); vibrate(15);
      toast(ROASTS[Math.floor(Math.random() * ROASTS.length)]);
      buildShop(); updateProgressUI(); updateRunHud();
      return;
    }
    const lvl = upg[k];
    if (lvl >= u.max) return;
    const cost = u.costs[lvl];
    if (totalScore < cost) return;
    totalScore -= cost;
    upg[k] = lvl + 1;
    saveTotal(); saveUpg();
    sfx.buy(); vibrate(15);
    toast('已购买 ' + u.name);
    buildShop();
    updateProgressUI();
    updateRunHud();
  }

  // ---------- 复活 ----------
  function showRevive() {
    reviveLeftEl.textContent = revivesLeft;
    reviveScreen.classList.remove('hidden');
    state = STATE.REVIVE;
  }
  function doRevive() {
    reviveScreen.classList.add('hidden');
    const b = blocks[curIdx];
    hero.wx = b.wx; hero.wy = b.wy; hero.z = 1; hero.squash = 0;
    jump.t = 0; jump.fallV = 0;
    spawnRipple(b.wx, b.wy, '#ffffff');
    sfx.perfect(); vibrate(15);
    state = STATE.READY;
  }
  function giveUp() {
    reviveScreen.classList.add('hidden');
    gameOver();
  }

  // ---------- 更新 ----------
  let last = performance.now();
  function update(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;

    const tgt = blocks[curIdx];
    cam.wx += (tgt.wx - cam.wx) * Math.min(dt * 4, 1);
    cam.wy += (tgt.wy - cam.wy) * Math.min(dt * 4, 1);

    if (state === STATE.CHARGING) {
      charge = Math.min((now - chargeStart) / MAX_CHARGE, 1);
      hero.squash = 0.15 + charge * 0.35;
    }
    if (state === STATE.JUMPING) {
      jump.t += dt / jump.dur;
      const t = Math.min(jump.t, 1);
      hero.wx = jump.fromX + (jump.toX - jump.fromX) * t;
      hero.wy = jump.fromY + (jump.toY - jump.fromY) * t;
      hero.z = 1 + Math.sin(Math.PI * t) * jump.h;
      hero.squash = 0;
      if (jump.t >= 1) { hero.z = 0; resolveLanding(); }
    }
    if (state === STATE.FALLING) {
      jump.fallV += dt * 9;
      hero.z -= jump.fallV * dt;
      hero.wx += (jump.toX - hero.wx) * dt * 2;
      hero.wy += (jump.toY - hero.wy) * dt * 2;
      if (hero.z < -3) { gameOver(); }
    }

    if (hero.squash > 0 && state !== STATE.CHARGING) {
      hero.squash = Math.max(0, hero.squash - dt * 3);
    }

    for (const r of ripples) { r.r += dt * 2.2; r.life -= dt * 1.2; }
    ripples = ripples.filter(r => r.life > 0);
    for (const p of particles) { p.wx += p.vx; p.wy += p.vy; p.z += p.vz; p.vz -= dt*0.15; p.life -= dt*1.1; }
    particles = particles.filter(p => p.life > 0);

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) {
        comboEl.style.transition = 'opacity .3s, transform .3s';
        comboEl.style.opacity = '0';
        comboEl.style.transform = 'translate(-50%,-50%) scale(0.6)';
      }
    }
    if (tierTimer > 0) {
      tierTimer -= dt;
      if (tierTimer <= 0) {
        const el = document.getElementById('tier');
        el.style.transition = 'opacity .35s, transform .35s';
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%,-50%) scale(0.6)';
      }
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    draw();
    requestAnimationFrame(update);
  }

  // ---------- 绘制 ----------
  function drawBlock(b, isTarget) {
    const top = [
      project(b.wx - HALF, b.wy - HALF, 1),
      project(b.wx + HALF, b.wy - HALF, 1),
      project(b.wx + HALF, b.wy + HALF, 1),
      project(b.wx - HALF, b.wy + HALF, 1)
    ];
    const botL = project(b.wx - HALF, b.wy - HALF, 0);
    const botR = project(b.wx + HALF, b.wy - HALF, 0);
    const botR2 = project(b.wx + HALF, b.wy + HALF, 0);
    const base = b.gold ? b.color : b.color;
    ctx.fillStyle = shade(base, -0.22);
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y); ctx.lineTo(top[3].x, top[3].y);
    ctx.lineTo(botR2.x, botR2.y); ctx.lineTo(botL.x, botL.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(base, -0.40);
    ctx.beginPath();
    ctx.moveTo(top[3].x, top[3].y); ctx.lineTo(top[2].x, top[2].y);
    ctx.lineTo(botR2.x, botR2.y); ctx.lineTo(botR.x, botR.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(top[i].x, top[i].y);
    ctx.closePath(); ctx.fill();
    if (b.gold) {
      ctx.strokeStyle = 'rgba(255,220,90,.9)'; ctx.lineWidth = 3;
      ctx.stroke();
    }
    if (isTarget) {
      const c = project(b.wx, b.wy, 1);
      ctx.strokeStyle = 'rgba(58,160,255,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, effGreat()*TILE_W/2, effGreat()*TILE_H/2, 0, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,170,40,.95)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, effPerfect()*TILE_W/2, effPerfect()*TILE_H/2, 0, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,170,40,.95)';
      ctx.beginPath(); ctx.arc(c.x, c.y, 3.5, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawHero() {
    const sq = hero.squash;
    const p = project(hero.wx, hero.wy, hero.z);
    const bodyH = 34 * (1 - sq);
    const bodyW = 18 * (1 + sq * 0.6);
    const cx = p.x, baseY = p.y;
    const sh = project(hero.wx, hero.wy, 1);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(sh.x, sh.y, 16 - hero.z*2, 8 - hero.z, 0, 0, Math.PI*2);
    ctx.fill();
    const sk = SKINS[currentSkin] || SKINS[0];
    ctx.fillStyle = sk.body;
    roundRect(cx - bodyW/2, baseY - bodyH, bodyW, bodyH, bodyW/2);
    ctx.fill();
    ctx.fillStyle = sk.head;
    ctx.beginPath();
    ctx.arc(cx, baseY - bodyH - 7, 11 * (1 - sq*0.3), 0, Math.PI*2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawRipples() {
    for (const r of ripples) {
      const p = project(r.wx, r.wy, 1);
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = Math.max(0, r.life);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r.r * TILE_W/2, r.r * TILE_H/2, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  function drawParticles() {
    for (const p of particles) {
      const s = project(p.wx, p.wy, p.z);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawChargeBar() {
    if (state !== STATE.READY && state !== STATE.CHARGING) return;
    const bw = 230, bh = 16;
    const bx = W/2 - bw/2, by = H * 0.80;
    // 背景槽
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    roundRect(bx, by, bw, bh, 8); ctx.fill();
    // 辅助线: 落点安全区/完美区(基于当前目标块距离动态计算)
    if (upg.assist >= 1 && assistOn) {
      const cur = blocks[curIdx], tgt = blocks[curIdx + 1];
      const dlen = Math.hypot(tgt.wx - cur.wx, tgt.wy - cur.wy) || 1;
      const clamp = v => Math.max(0, Math.min(1, v));
      const sLo = clamp((dlen - effHalf()) / MAX_JUMP), sHi = clamp((dlen + effHalf()) / MAX_JUMP);
      ctx.fillStyle = 'rgba(70,200,120,.5)';
      roundRect(bx + bw*sLo, by, bw*(sHi - sLo), bh, 4); ctx.fill();
      if (upg.assist >= 2) {
        const pLo = clamp((dlen - effPerfect()) / MAX_JUMP), pHi = clamp((dlen + effPerfect()) / MAX_JUMP);
        ctx.fillStyle = 'rgba(255,170,40,.85)';
        roundRect(bx + bw*pLo, by, bw*(pHi - pLo), bh, 4); ctx.fill();
      }
      // 正中(完美中心)刻度
      const cc = clamp(dlen / MAX_JUMP);
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.fillRect(bx + bw*cc - 1.5, by - 4, 3, bh + 8);
    }
    // 当前蓄力(透明填充 + 指针)
    if (state === STATE.CHARGING) {
      ctx.fillStyle = 'rgba(255,176,58,.35)';
      roundRect(bx, by, bw * charge, bh, 8); ctx.fill();
      const nx = bx + bw * charge;
      ctx.fillStyle = charge >= 0.99 ? '#ff5252' : '#fff';
      ctx.fillRect(nx - 2, by - 5, 4, bh + 10);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 8); ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#bfe6f5'); g.addColorStop(1, '#9fd3ec');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W+40, H+40);

    const items = blocks.map(b => ({ z: b.wx + b.wy, kind:'block', obj:b }));
    items.push({ z: hero.wx + hero.wy + 0.01, kind:'hero' });
    items.sort((a, b) => a.z - b.z);
    const targetB = blocks[curIdx + 1];
    for (const it of items) {
      if (it.kind === 'block') drawBlock(it.obj, it.obj === targetB && state !== STATE.OVER);
      else drawHero();
    }
    drawRipples();
    drawParticles();
    drawChargeBar();
    ctx.restore();
  }

  function shade(hex, amt) {
    const c = hex.replace('#','');
    let r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    r = Math.max(0, Math.min(255, Math.round(r + r*amt)));
    g = Math.max(0, Math.min(255, Math.round(g + g*amt)));
    b = Math.max(0, Math.min(255, Math.round(b + b*amt)));
    return 'rgb('+r+','+g+','+b+')';
  }

  // ---------- 皮肤选择器 ----------
  const skinsEl = document.getElementById('skins');
  const tpValEl = document.getElementById('tpVal');
  let tierTimer = 0;
  function isUnlocked(s) { return totalPerfect >= s.unlockPerfect; }
  function buildSkins() {
    skinsEl.innerHTML = '';
    tpValEl.textContent = totalPerfect;
    SKINS.forEach(s => {
      const d = document.createElement('div');
      d.className = 'skin' + (s.id === currentSkin ? ' sel' : '') + (isUnlocked(s) ? '' : ' locked');
      d.style.background = s.body;
      d.title = s.name;
      if (!isUnlocked(s)) {
        const lk = document.createElement('div'); lk.className = 'lk';
        lk.textContent = s.unlockPerfect; d.appendChild(lk);
      }
      if (isUnlocked(s)) {
        d.addEventListener('click', () => {
          currentSkin = s.id;
          try { localStorage.setItem('jump_skin', currentSkin); } catch(e){}
          buildSkins();
        });
      }
      skinsEl.appendChild(d);
    });
  }
  function showTier(text, color) {
    const el = document.getElementById('tier');
    el.textContent = text; el.style.color = color;
    el.style.transition = 'none'; el.style.opacity = '1';
    el.style.transform = 'translate(-50%,-50%) scale(1.15)';
    tierTimer = 0.7;
  }
  function showUnlock(name) {
    const el = document.getElementById('tier');
    el.textContent = '解锁 ' + name + '!'; el.style.color = '#ff6b5e';
    el.style.transition = 'none'; el.style.opacity = '1';
    el.style.transform = 'translate(-50%,-50%) scale(1.2)';
    tierTimer = 1.4;
  }

  // ---------- 流程 ----------
  function startGame() {
    resetGame();
    runJumps = 0; revivesLeft = reviveMax(); milestoneHit = {};
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    shopScreen.classList.add('hidden');
    reviveScreen.classList.add('hidden');
    drinkScreen.classList.add('hidden');
    updateRunHud();
  }
  function gameOver() {
    state = STATE.OVER;
    finalScoreEl.textContent = score;
    overTipEl.textContent = (score >= best && score > 0) ? '新纪录！' : '本次得分';
    overScreen.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('shopBtn').addEventListener('click', () => openShop('start'));
  document.getElementById('overShopBtn').addEventListener('click', () => openShop('over'));
  document.getElementById('shopClose').addEventListener('click', closeShop);
  document.getElementById('reviveBtn').addEventListener('click', doRevive);
  document.getElementById('giveUpBtn').addEventListener('click', giveUp);
  document.getElementById('drinkClose').addEventListener('click', () => drinkScreen.classList.add('hidden'));
  document.getElementById('achClose').addEventListener('click', () => achScreen.classList.add('hidden'));
  document.getElementById('backupBtn').addEventListener('click', openBackup);
  document.getElementById('backupClose').addEventListener('click', closeBackup);
  document.getElementById('exportBtn').addEventListener('click', exportSave);
  document.getElementById('importBtn').addEventListener('click', importSave);

  // ---------- 蓄力辅助线开关 ----------
  const assistBtn = document.getElementById('assistBtn');
  function refreshAssistBtn() {
    if (upg.assist >= 1) {
      assistBtn.style.display = '';
      assistBtn.textContent = '辅助线：' + (assistOn ? '开' : '关');
    } else {
      assistBtn.style.display = 'none';
    }
  }
  assistBtn.addEventListener('click', () => {
    assistOn = !assistOn; saveAssist(); refreshAssistBtn();
    toast('辅助线已' + (assistOn ? '开启（蓄力槽显示落点区）' : '关闭（每20跳当局积分翻倍）'));
  });

  // ---------- 作弊彩蛋 ----------
  const cheatBtn = document.getElementById('cheatBtn');
  const cheatFlow = document.getElementById('cheatFlow');
  const cheatTitle = document.getElementById('cheatTitle');
  const cheatMsg = document.getElementById('cheatMsg');
  const cheatInputWrap = document.getElementById('cheatInputWrap');
  const cheatInput = document.getElementById('cheatInput');
  const cheatOk = document.getElementById('cheatOk');
  const cheatCancel = document.getElementById('cheatCancel');
  const cheatAdd1k = document.getElementById('cheatAdd1k');
  const cheatAdd1w = document.getElementById('cheatAdd1w');
  let cheatStep = 0, cheatReturn = 'start';
  function openCheat() {
    cheatReturn = (overScreen.classList.contains('hidden') && startScreen.classList.contains('hidden')) ? 'game'
                : (startScreen.classList.contains('hidden') ? 'over' : 'start');
    cheatStep = 1;
    cheatInputWrap.style.display = 'none';
    cheatTitle.textContent = '作弊';
    cheatMsg.textContent = '你确定要作弊吗？';
    cheatOk.textContent = '确定';
    cheatBtn.style.display = 'none';
    assistBtn.style.display = 'none';
    cheatFlow.classList.remove('hidden');
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
  }
  function closeCheat() {
    cheatStep = 0;
    cheatFlow.classList.add('hidden');
    cheatBtn.style.display = '';
    assistBtn.style.display = (upg.assist >= 1) ? '' : 'none';
    if (cheatReturn === 'over') overScreen.classList.remove('hidden');
    else if (cheatReturn === 'start') startScreen.classList.remove('hidden');
  }
  cheatBtn.addEventListener('click', openCheat);
  cheatCancel.addEventListener('click', closeCheat);
  cheatOk.addEventListener('click', () => {
    if (cheatStep === 1) { cheatStep = 2; cheatMsg.textContent = '你真的要作弊吗？'; }
    else if (cheatStep === 2) { cheatStep = 3; cheatMsg.textContent = '好吧你真准备作弊'; }
    else if (cheatStep === 3) {
      cheatStep = 4; cheatTitle.textContent = '验证作者';
      cheatMsg.textContent = '输入作者姓名以继续：';
      cheatInputWrap.style.display = 'block'; cheatInput.type = 'text'; cheatInput.value = ''; cheatInput.placeholder = '作者姓名';
      cheatOk.textContent = '确认';
    }
    else if (cheatStep === 4) {
      if (cheatInput.value.trim() === '赵硕洋') {
        cheatStep = 5; cheatTitle.textContent = '作弊成功';
        cheatMsg.textContent = '修改积分数量（当前 ' + totalScore + '）：';
        cheatInputWrap.style.display = 'block'; cheatInput.type = 'number'; cheatInput.value = totalScore; cheatInput.placeholder = '输入积分';
        cheatOk.textContent = '确定修改';
      } else { toast('作者姓名不对，作弊失败'); closeCheat(); }
    }
    else if (cheatStep === 5) {
      const v = parseInt(cheatInput.value, 10);
      if (!isNaN(v) && v >= 0) {
        totalScore = v; saveTotal(); updateProgressUI(); updateRunHud(); checkProgress();
        toast('积分已修改为 ' + v);
      }
      closeCheat();
    }
  });
  cheatAdd1k.addEventListener('click', () => { totalScore += 1000; saveTotal(); updateProgressUI(); updateRunHud(); checkProgress(); cheatInput.value = totalScore; });
  cheatAdd1w.addEventListener('click', () => { totalScore += 10000; saveTotal(); updateProgressUI(); updateRunHud(); checkProgress(); cheatInput.value = totalScore; });

  // 初始预览
  buildSkins();
  refreshAssistBtn();
  resetGame();
  state = STATE.READY;
  updateRunHud();
  updateProgressUI();
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
